kind = "web"
previewPath = "/"
title = "AI English Speaking Trainer"
version = "1.0.0"
id = "artifacts/english-trainer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 8081

[services.development]
run = "pnpm --filter @workspace/english-trainer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/english-trainer", "run", "build" ]
publicDir = "artifacts/english-trainer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "8081"
BASE_PATH = "/"
